
name: Update official data

on:
  schedule:
    - cron: "15 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update public data
        run: python scripts/update_official_data.py

      - name: Commit only when changed
        run: |
          git config user.name "komatta-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update official data"

            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict. Stopping safely."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Push succeeded."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi

              sleep 3
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
