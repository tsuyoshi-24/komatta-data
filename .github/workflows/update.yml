name: Update official data

on:
  schedule:
    - cron: "15 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Update public data
        run: python scripts/update_official_data.py

      - name: Commit only when changed
        run: |
          git config user.name "komatta-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto update official data"
            git push
          fi
